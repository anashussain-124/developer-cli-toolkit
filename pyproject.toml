
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtoolkit"
version = "0.1.0"
description = "A command-line toolkit for common developer utilities"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "pytest>=8.0",
]

[project.scripts]
devtoolkit = "devtoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

